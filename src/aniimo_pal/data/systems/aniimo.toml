# Aniimo game-system vocabulary used to validate creature source profiles.
#
# STATUS: UNVERIFIED. Compiled from fan/community guides (see `sources`), not from
# game data. Replace with values confirmed from the user's own install (data tables
# located with `aniimo-pal objects find`) and bump `version` when you do.
# Old creature projects keep validating against the version they recorded.

[system]
id = "aniimo"
version = "0.1.0"
game_version = "unknown"
status = "unverified"
max_elements = 2   # guides report dual-element Aniimo
sources = [
  "https://allthings.how/aniimo-type-chart-all-9-element-matchups-and-damage-multipliers/",
  "https://thegameswiki.com/aniimo/wiki/aniimo-base-stats",
  "https://aniimotools.dev/systems/homeland/stations/",
  "https://www.hideoutgacha.com/games/aniimo/training-guide",
]

# Rare appearances as described by the user (provenance: user). Not yet located in game data: the real
# installs seen so far hold only a few numbered materials per creature (e.g. MI_Parmon_10181_Body_01a..05a),
# so the palettes are probably applied at runtime (colour data / palette textures). Appearances must only
# be enabled for palettes found in the source data; none are invented.
[appearance]
provenance = "user"
changes_model = false           # Shiny looks are colour palettes only: same mesh, same form
shiny_per_creature = 12         # user: every Aniimo has 12 Shiny looks
named = ["dazzling", "shadow"]  # special Shiny looks; whether they are part of the 12 is still open
# Umbral: galaxy-purple palette, NOT one of the 12 Shiny looks but a separate 13th version (user).
extra = ["umbral"]
open_questions = [
  "Are Dazzling and Shadow part of the 12, or extra (12 numbered + 2)?",
  "How rare is Umbral compared with the Shiny looks, and can it combine with Prismana?",
  "Do Dazzling/Shadow add a visual effect (glow, aura) beyond colour?",
  "Where does the game store the palettes (data table, palette texture, shader parameters)?",
]

# Canonical ids (lowercase) with display names and aliases seen in guides.
[elements]
fire = { name = "Fire" }
water = { name = "Water" }
grass = { name = "Grass" }
lightning = { name = "Lightning", aliases = ["electric"] }
ice = { name = "Ice" }
earth = { name = "Earth", aliases = ["rock"] }
wind = { name = "Wind" }
light = { name = "Light", aliases = ["holy"] }
dark = { name = "Dark" }

# Six base stats reported by guides; the studio reportedly changed stat
# progression after the last beta, so values must come from game data.
[stats]
hp = { name = "HP" }
atk = { name = "ATK" }
pdef = { name = "P.DEF", aliases = ["physical_defense"] }
mdef = { name = "M.DEF", aliases = ["magic_defense"] }
break = { name = "BREAK", aliases = ["brk"] }
regen = { name = "REGEN" }

# Homeland work: guides report 13 jobs (nine element jobs + four general jobs)
# but do not name them consistently, so no ids are defined yet. Job levels are
# reported as 1-4 by one guide and stations as Lv 1-3 by another.
[work]
categories = []
level_min = 1
level_max = 4
level_status = "conflicting-sources"
